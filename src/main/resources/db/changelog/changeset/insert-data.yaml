databaseChangeLog:
  - changeSet:
      id: 2
      author: nikita
      runOnChange: true
      changes:
        - loadUpdateData:
            schemaName: coffee_machine
            tableName: recipe
            primaryKey: id
            file: db/changelog/data/recipe.csv
            columns:
              - column:
                  index: 2
                  name: name
              - column:
                  index: 1
                  name: id
        - loadUpdateData:
            schemaName: coffee_machine
            tableName: ingredient
            primaryKey: id
            file: db/changelog/data/ingredients.csv
            columns:
              - column:
                  index: 1
                  name: id
              - column:
                  index: 2
                  name: name
              - column:
                  index: 3
                  name: quantity
        - loadUpdateData:
            schemaName: coffee_machine
            tableName: statistics
            primaryKey: id
            file: db/changelog/data/statistics.csv
            columns:
              - column:
                  index: 1
                  name: id
              - column:
                  index: 2
                  name: order_count
              - column:
                  index: 3
                  name: recipe_id